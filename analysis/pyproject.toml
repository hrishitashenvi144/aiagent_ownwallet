[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditagent-analysis"
version = "0.1.0"
description = "Containerized static analysis and LLM triage engine for AuditAgent"
authors = [{ name = "Person 2 (Analysis)", email = "person2@auditagent.local" }]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]
