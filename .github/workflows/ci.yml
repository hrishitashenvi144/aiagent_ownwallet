name: AuditAgent CI Pipeline

on:
  push:
    branches: [main, develop, feat/*]
  pull_request:
    branches: [main, develop]

jobs:
  shared-schemas:
    name: Verify Shared JSON Schemas & Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON Schemas
        run: |
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('shared/schemas/*.json') + glob.glob('shared/abis/*.json')]; print('All schemas & ABIs valid!')"

  contracts:
    name: Foundry Contracts Test & Gas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Run Forge Build & Tests
        run: |
          cd contracts
          forge build --sizes
          forge test -vvv

  analysis:
    name: Analysis Engine Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd analysis
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff
      - name: Lint Analysis Engine
        run: |
          cd analysis
          ruff check .
      - name: Run Analysis Tests
        run: |
          cd analysis
          pytest tests/ -v

  agent:
    name: Agent Core Tests & API Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd agent
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx ruff
      - name: Lint Agent Core
        run: |
          cd agent
          ruff check .
      - name: Run Agent Core Tests
        run: |
          cd agent
          pytest tests/ -v

  dashboard:
    name: Next.js Dashboard Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd dashboard
          npm ci --prefer-offline || npm install
      - name: Run Dashboard Tests
        run: |
          cd dashboard
          npm test --if-present

  security-tests:
    name: Adversarial Security & Attack Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Security Test Cases
        run: |
          cd security-tests
          python -m pip install pytest httpx
          pytest tests/ -v

  benchmark-eval:
    name: Benchmark Regression & Threshold Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Benchmark Evaluation Regression Gate
        run: |
          python benchmarks/runner.py --dataset benchmarks/datasets/sample_contracts --compare-baselines --assert-thresholds
