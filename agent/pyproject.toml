[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditagent-core"
version = "0.1.0"
description = "Core FastAPI service, x402 paywall, and economic brain for AuditAgent"
authors = [{ name = "Person 3 (Agent Core)", email = "person3@auditagent.local" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "web3>=6.0.0",
    "httpx>=0.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0"
]
